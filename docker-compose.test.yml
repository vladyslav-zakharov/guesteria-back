name: guesteria-back-test

services:
    postgresdb:
        image: postgres:16.4
        container_name: guesteria-test-postgres-db
        restart: no
        environment:
            POSTGRES_DB: "postgres"
            POSTGRES_USER: "postgres"
            POSTGRES_PASSWORD: "12345"
        ports:
            - "5436:5432"
        expose:
            - "5432"
        volumes:
            - "./.volumes/test-postgresql:/var/lib/postgresql/data"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
            interval: 2s
            timeout: 5s
            retries: 30
